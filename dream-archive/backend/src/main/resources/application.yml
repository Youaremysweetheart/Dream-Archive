server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dream-archive

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dream_archive?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dreamarchive.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT config
jwt:
  secret: dreamArchiveSecretKey2024ForJWTTokenGeneration
  expiration: 604800000  # 7 days (ms)

# Upload path
file:
  upload-path: ./uploads/
  access-path: /uploads/**

# Dream sentiment service
sentiment:
  base-url: http://localhost:5000

# Logging
logging:
  level:
    com.dreamarchive: debug
    org.springframework: info
  file:
    name: logs/dream-archive.log
